spring.application.name=apigateway
server.port=8083

spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://eurekaserver:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=3
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1

spring.cloud.gateway.discovery.locator.enabled=false

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

spring.cloud.gateway.routes[0].id=bookservice
spring.cloud.gateway.routes[0].uri=lb://bookservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/books/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=bookServiceCircuitBreaker,fallbackUri=forward:/fallback/books

resilience4j.circuitbreaker.instances.bookServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bookServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bookServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookServiceCircuitBreaker.waitDurationInOpenState=10s

management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true